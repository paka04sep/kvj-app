<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <circle cx="256" cy="256" r="160" fill="url(#emerald-glow)" opacity="0.15"/>
  
  <defs>
    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g transform="translate(128, 128)">
    <!-- Upward savings curve -->
    <path d="M 32 192 C 80 144, 144 144, 192 64" fill="none" stroke="url(#emerald-grad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 192 64 L 224 60 L 210 92 Z" fill="#34d399"/>

    <!-- "K" stylized bar -->
    <rect x="48" y="48" width="24" height="160" rx="12" fill="url(#blue-grad)"/>
    <!-- "K" diagonal up -->
    <path d="M 60 128 L 140 48" stroke="url(#blue-grad)" stroke-width="24" stroke-linecap="round"/>
    <!-- "K" diagonal down -->
    <path d="M 60 128 L 148 208" stroke="url(#emerald-grad)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>